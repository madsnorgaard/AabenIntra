name: Release

# Pushing a tag vX.Y.Z creates (or updates) the matching GitHub release with
# notes generated from merged PR titles, grouped by .github/release.yml.
# The curated human-readable history lives in CHANGELOG.md; this workflow
# publishes the mechanical "what merged since the last tag" list next to it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Create or update the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - regenerating notes"
            NOTES=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body)
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
