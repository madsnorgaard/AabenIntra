name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_recreate:
        description: 'Force recreate containers'
        type: boolean
        default: false
      run_updb:
        description: 'Run drush post-deploy (DB snapshot + updb + cr). Turn OFF only for the very first install.'
        type: boolean
        default: true

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: madsnorgaard/contabo-infrastructure
          event-type: deploy
          # AabenIntra is built from recipes + module hook_install, NOT config
          # sync, so the post-deploy must NOT run `drush cim` (it would delete
          # active config). skip_cim makes the pipeline run cr+updb only.
          # Pushes to main always run the post-deploy step so security updates
          # with pending DB updates are applied and a pre-deploy DB snapshot
          # is taken; it was previously off by default, so the Oct 14 2026
          # core 11.4.10 deploy ran without updb or a rollback snapshot.
          client-payload: |
            {
              "project_dir": "aabenintra.fenixnordic.solutions",
              "project_type": "drupal",
              "drupal_service": "drupal",
              "repo_name": "AabenIntra",
              "force_recreate": "${{ inputs.force_recreate || false }}",
              "run_updb": "${{ github.event_name == 'push' || inputs.run_updb }}",
              "skip_cim": "true"
            }
