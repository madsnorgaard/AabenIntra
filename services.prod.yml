parameters:
  # Session policy - see docs/SESSION-POLICY.md before changing.
  session.storage.options:
    gc_probability: 1
    gc_divisor: 100
    # Server-side idle lifetime: 8 hours (a working day). A session that is
    # not used for 8 h is garbage-collected and the next request must log in.
    gc_maxlifetime: 28800
    # Session cookie, not persistent: it is discarded when the browser closes.
    # There is no "remember me"; shared municipal PCs must not keep a login.
    cookie_lifetime: 0
    cookie_samesite: Lax
    # Core overrides this from the request scheme (Request::isSecure()), which
    # is HTTPS via Traefik's X-Forwarded-Proto with reverse_proxy enabled in
    # settings.php. Kept explicit so the intended value is documented.
    cookie_secure: true
  # AabenIntra is a server-rendered themed Drupal site (not headless), so no
  # cross-origin API access is configured.

  # Logging (aabenintra_observability + monolog). Every channel goes to the
  # container's stderr as one ECS-shaped JSON line, which the docker json-file
  # driver stores and promtail/Alloy ships to Loki. The watchdog table (dblog)
  # and Sentry are appended at compile time when LOG_DBLOG=1 / SENTRY_DSN is
  # set - see docs/OBSERVABILITY.md. The handler level follows LOG_LEVEL.
  monolog.channel_handlers:
    default:
      handlers:
        - name: 'aabenintra_stderr'
          formatter: 'aabenintra_ecs_or_drush'
  monolog.processors:
    - 'message_placeholder'
    - 'current_user'
    - 'request_uri'
    - 'ip'
    - 'referer'
    - 'aabenintra_memory_bytes'
    - 'filter_backtrace'
